[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hayvoz"
dynamic = ["version"]
description = "Privacy-first local meeting recorder and multilingual interview assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
  "faster-whisper>=1.1,<2",
  "onnxruntime==1.23.1 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
openai = [
  "openai>=2,<3",
]
mcp = [
  "mcp>=2,<3",
]
dev = [
  "mcp>=2,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
hayvoz = "app.ui.cli:app"
hayvoz-native = "app.browser.native_host:main"

[project.urls]
Homepage = "https://github.com/ur-pablo/HayVoz"
Issues = "https://github.com/ur-pablo/HayVoz/issues"
Repository = "https://github.com/ur-pablo/HayVoz.git"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "app/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
