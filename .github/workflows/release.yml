name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed-source release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - name: Install Python
        run: uv python install 3.11
      - name: Install locked dependencies
        run: uv sync --extra dev --locked --python 3.11
      - name: Verify tag and synchronized version
        shell: bash
        run: uv run python scripts/version.py check --expect "${GITHUB_REF_NAME#v}"
      - name: Validate source
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
          uv run pytest
          uv run python -m compileall -q app tests
      - name: Build distributions
        run: uv build
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --generate-notes --title "HayVoz $GITHUB_REF_NAME"
